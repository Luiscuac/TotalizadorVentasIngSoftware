<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Ventas</title>
  </head>
  <body>
    <h1>Totalizador de Ventas</h1>
    <form id="venta-form">
      <div>
        <label for="cantidad">Cantidad de items:</label>
        <input type="number" id="cantidad" required />
      </div>
      <div>
        <label for="precio">Precio por item ($):</label>
        <input type="number" id="precio" step="0.01" required />
      </div>
      <div>
        <label for="estado">Codigo de estado:</label>
        <select id="estado">
          <option value="UT">UT - Utah</option>
          <option value="NV">NV - Nevada</option>
          <option value="TX">TX - Texas</option>
          <option value="AL">AL - Alabama</option>
          <option value="CA">CA - California</option>
        </select>
      </div>
      <br>
      <input type="submit" value="Totalizar" id="totalizar-button" />
    </form>
    
    <div id="resultado-div" style="margin-top: 20px;"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
